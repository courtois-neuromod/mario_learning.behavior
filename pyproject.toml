[project]
name = "mario_learning"
version = "0.1.0"
description = "Behavioral analysis of mario.scenes-formatted datasets (human and agent-produced)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyarrow==18.1.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "Pillow==11.0.0",
    "pyyaml==6.0.2",
    "invoke==2.2.0",
    "scipy==1.14.1",
    "umap-learn==0.5.7",
    "scikit-learn==1.5.2",
    "lifelines==0.30.0",
    "POT==0.9.5",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mario_learning"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
